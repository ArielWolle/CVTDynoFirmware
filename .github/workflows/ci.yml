name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
          key: platformio-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build firmware
        run: pio run
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          # .uf2 is the one actually used to flash this board (drag-and-drop while it's in
          # BOOTSEL/mass-storage mode); .bin/.elf are included too for other tools/debugging.
          name: firmware-${{ github.sha }}
          path: |
            .pio/build/*/firmware.uf2
            .pio/build/*/firmware.bin
            .pio/build/*/firmware.elf
          if-no-files-found: error
          retention-days: 90
