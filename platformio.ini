; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nanorp2040connect]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = nanorp2040connect
framework = arduino
board_build.core = earlephilhower
; Switch USB stack from the default Pico-SDK CDC-only implementation to Adafruit TinyUSB so we can
; expose a vendor-class (WebUSB/WinUSB) bulk interface instead of a virtual COM port -- see the USB
; TELEMETRY PROTOCOL comment block in src/main.cpp for why.
build_flags = -DUSE_TINYUSB
; Custom USB identity so the device shows up as "CVT Dyno" in the browser's WebUSB device picker
; instead of the board's default "Nano RP2040 Connect" -- and so the viewer can filter
; navigator.usb.requestDevice()/getDevices() by vendorId/productId instead of matching on the
; product string. VID 0x1209 is the pid.codes shared vendor ID for open-source hobbyist hardware
; (http://pid.codes) -- PID 0xCD10 here is a local placeholder, NOT yet formally registered there;
; register a real PID at pid.codes before distributing this device outside this project.
board_build.arduino.earlephilhower.usb_manufacturer = CVT Dyno Project
board_build.arduino.earlephilhower.usb_product = CVT Dyno
board_build.arduino.earlephilhower.usb_vid = 0x1209
board_build.arduino.earlephilhower.usb_pid = 0xCD10
